<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GD&amp;T in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the combined site's shell. Public landing page when signed out; when signed in, one workspace with
   Learn (3D lessons + stack-up tools) and Manage (groups, requests, staff, content, roles), all gated by role. */
:root{
  --bg:#f3f4f2;
  --surface:#fbfbfa;
  --ink:#232a30;
  --muted:#606b73;
  --line:#dfe3e1;
  --accent:#41627f;
  --pass:#3f7a5c;
  --fail:#a2504a;
  --warn:#8a6d2f;
  --font-display:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#151a1d;--surface:#1b2125;--ink:#dce2e5;--muted:#98a3aa;--line:#2b3338;--accent:#93b1cc;--pass:#7cb294;--fail:#d28c84;--warn:#cfb06e;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#151a1d;--surface:#1b2125;--ink:#dce2e5;--muted:#98a3aa;--line:#2b3338;--accent:#93b1cc;--pass:#7cb294;--fail:#d28c84;--warn:#cfb06e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.6}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(28px,4vw,38px);letter-spacing:-.01em}
h2{font-size:21px}
h3{font-size:16.5px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-top:10px;padding-bottom:10px}
.brand{font-weight:600;font-size:16px}
.mock{font:500 11.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 8%,transparent);padding:2px 8px;border-radius:999px}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.who label{color:var(--muted)}
select,input[type=text],input[type=email],textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:70px;width:100%}
select:disabled{color:var(--muted);background:transparent}
.rolechip{font:500 12.5px var(--font-body);padding:3px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--accent);white-space:nowrap}
.rolechip.student{border-color:var(--line);background:transparent;color:var(--muted)}

/* buttons */
.btn{font:500 14px var(--font-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.btn.primary{background:color-mix(in srgb,var(--accent) 13%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.btn.danger:hover:not(:disabled){border-color:color-mix(in srgb,var(--fail) 55%,var(--line));color:var(--fail);background:color-mix(in srgb,var(--fail) 6%,transparent)}
.btn.sm{font-size:13px;padding:4px 9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* status pills */
.st{font:500 12px var(--font-body);padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st.active{color:var(--pass);border-color:color-mix(in srgb,var(--pass) 35%,var(--line));background:color-mix(in srgb,var(--pass) 9%,transparent)}
.st.invited{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn) 8%,transparent)}
.st.draft{color:var(--muted)}
.st.pub{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}

/* landing */
.hero{padding:44px 0 20px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:28px;align-items:start}
.hero p.lede{color:var(--muted);max-width:60ch;margin:12px 0 0;font-size:16.5px}
.offer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:8px 0 28px}
.offer .panel{padding:16px 18px}
.offer .k{font:500 12px var(--font-mono);color:var(--muted);letter-spacing:.04em}
.offer h3{margin:4px 0 6px}
.offer p{margin:0;font-size:14.5px;color:var(--muted)}
.form{display:grid;gap:10px}
.form label{font-size:13.5px;font-weight:500;display:grid;gap:4px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:14px;border-radius:8px;padding:9px 12px;border:1px solid var(--line)}
.msg.ok{border-color:color-mix(in srgb,var(--pass) 35%,var(--line));background:color-mix(in srgb,var(--pass) 7%,transparent)}
.msg.err{border-color:color-mix(in srgb,var(--fail) 35%,var(--line));background:color-mix(in srgb,var(--fail) 6%,transparent)}
.msg.info{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.msg.warn{border-color:color-mix(in srgb,var(--fail) 28%,var(--line));background:color-mix(in srgb,var(--fail) 4%,transparent)}
.methodnote{display:grid;gap:6px}

/* app shell */
.app{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;padding:22px 0 40px}
.side{position:sticky;top:12px;align-self:start;display:grid;gap:14px}
.side .grp{font:500 11.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 2px 10px}
.side nav{display:grid;gap:2px}
.side button{all:unset;cursor:pointer;padding:7px 10px;border-radius:7px;font-size:14.5px;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.side button:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.side button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);font-weight:500}
.side button:focus-visible{outline:2px solid var(--accent)}
.count{font:500 12px var(--font-mono);color:var(--muted)}
.pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px;margin-bottom:14px}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:70ch}

/* learn cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{padding:16px;display:grid;gap:8px;align-content:start}
.item .k{font:500 12px var(--font-mono);color:var(--muted)}
.item p{margin:0;font-size:14px;color:var(--muted)}
.item.locked{opacity:.6}
.prog{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:color-mix(in srgb,var(--pass) 60%,var(--surface))}

/* groups */
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.glist{display:grid;gap:6px}
.gbtn{all:unset;cursor:pointer;display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.gbtn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.gbtn[aria-current="true"]{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.gbtn:focus-visible{outline:2px solid var(--accent)}
.gbtn b{font-weight:500}
.gbtn span{font-size:12.5px;color:var(--muted)}
.sec{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.sec h3 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:7px}
.checks input{margin-top:4px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:999px}
.pchip button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.pchip button:hover{color:var(--fail);background:color-mix(in srgb,var(--fail) 8%,transparent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.c,.tbl th.c{text-align:center}
.tblwrap{overflow-x:auto}
.who2{display:grid}
.who2 small{color:var(--muted);font-size:12.5px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:14px}
.cell-ok{color:var(--pass);font-family:var(--font-mono)}
.cell-no{color:var(--muted)}

/* roles matrix */
.matrix td.c{font-size:15px}
.yes{color:var(--pass)} .no{color:color-mix(in srgb,var(--muted) 60%,transparent)} .part{color:var(--warn);font-size:12.5px}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.08);max-width:min(560px,92vw);display:none}
#toast.show{display:block}

footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding:14px 0 30px;margin-top:10px}

/* problem creator & player */
.creator{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);gap:16px;align-items:start}
.cside{position:sticky;top:12px}
.vslot{height:380px;position:relative;border-radius:12px 12px 0 0;overflow:hidden;background:var(--bg)}
.pviewer{position:absolute;inset:0}
.pviewer canvas{display:block;width:100%;height:100%;touch-action:none}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.fld{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.fld input[type=text],.fld select,.fld textarea{color:var(--ink);font-size:14px;padding:5px 7px}
.fld input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:6px 0}
.frow{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:grid;gap:8px}
.warns{margin:0;padding-left:18px;font-size:13.5px;color:var(--fail)}
.fcfsvg{vertical-align:middle}
.dtag{font:600 11px var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--accent);margin-left:4px}
table.ws input,table.ws select{padding:4px 6px;font-size:13.5px}
table.ws tfoot td{border-bottom:0;padding-top:8px;font-weight:500}
table.ws th .hint{font:500 11px var(--font-mono);color:var(--accent);letter-spacing:.02em}
.errpick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.errpick input{width:18px;height:18px;accent-color:var(--accent)}
.bdim{display:inline-block;border:1px solid currentColor;padding:0 3px;line-height:1.25;font-family:var(--font-mono,monospace)}
.rlrow{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.rlmarks{display:flex;flex-wrap:wrap;gap:6px}
.rlmarks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.rlmarks label.on{border-color:color-mix(in srgb,var(--fail) 55%,var(--line));background:color-mix(in srgb,var(--fail) 8%,transparent);color:var(--fail)}
.rlmarks input{width:15px;height:15px;accent-color:var(--fail)}
.pickopt{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.pickopt input{width:18px;height:18px;accent-color:var(--accent)}
.rvq{display:grid;gap:8px;margin-bottom:14px}
.rvq .rvi{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.st.due{border-color:color-mix(in srgb,var(--fail) 40%,var(--line));color:var(--fail)}
.score-pill{font:600 14px var(--font-mono);padding:4px 12px;border-radius:999px;border:1px solid var(--line)}
.score-pill.good{color:var(--pass);border-color:color-mix(in srgb,var(--pass) 35%,var(--line));background:color-mix(in srgb,var(--pass) 9%,transparent)}
.score-pill.low{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn) 8%,transparent)}
.math{font:13px/1.7 var(--font-mono);background:color-mix(in srgb,var(--bg) 70%,var(--surface));border:1px solid var(--line);border-radius:7px;padding:8px 10px;overflow-x:auto}
@media (max-width:1000px){ .creator{grid-template-columns:1fr} .cside{position:static} .vslot{height:300px} }

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .offer{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  .side{position:static}
  .side nav{display:flex;flex-wrap:wrap;gap:4px}
  .side .grp{display:none}
  .split{grid-template-columns:1fr}
}
@media (max-width:420px){ .wrap{padding:0 16px} .form .two{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
#viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#viewer[hidden]{display:none}
#viewer .vbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line, rgba(0,0,0,.12));background:var(--surface)}
#viewer .vbar .spacer{flex:1}
.vov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vlbl{position:absolute;left:0;top:0;font:500 12px var(--font-mono);color:var(--ink);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1.5px solid;border-radius:6px;padding:1px 6px;white-space:nowrap;display:flex;align-items:center;gap:4px;transition:opacity .15s}
.vlbl.dim{opacity:.3}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.gap{background:repeating-linear-gradient(90deg,#6b737a 0 3px,transparent 3px 5px);border:1px solid #6b737a}
.vlbl .sw{margin-right:0}
tr[data-lrow].hl td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
tr.hidden-step td{color:var(--muted)}
.why{margin-top:8px;padding:8px 10px;border-left:3px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:0 6px 6px 0;font-size:14px;line-height:1.55}
.whyi{color:var(--muted)}
td.nowrap{white-space:nowrap}
.row.nowrap{flex-wrap:nowrap;gap:4px}
.okc{color:var(--pass)} .failc{color:var(--fail)}
.teach .teachbar{gap:6px}
@media (max-width:700px){ .teach .teachbar{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:8px 0;margin:0 -2px} }
#viewer iframe{flex:1;border:0;width:100%;background:#fff}
.upl{position:relative;overflow:hidden;display:inline-flex;align-items:center;cursor:pointer}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <span class="brand">GD&amp;T in 3D</span>
    <span class="spacer"></span>
    <div class="who">
      <span id="whoName" class="small"></span>
      <span id="whoRole"></span>
    </div>
  </div>
</div>

<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="viewer" hidden>
  <div class="vbar"><b id="viewerTitle"></b><span class="spacer"></span><button class="btn sm" type="button" data-act="closeViewer">Close</button></div>
  <iframe id="viewerFrame" title="Lesson" sandbox="allow-scripts allow-popups allow-forms"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, signInWithEmailAndPassword, updatePassword, signOut } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, addDoc, collection, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const fdb = getFirestore(fbApp);
(function(){
"use strict";

/* ===================== Roles & permissions (single source of truth) ===================== */
const ROLES = {
  owner:           {label:'Owner',                  staff:true},
  admin:           {label:'Admin',                  staff:true},
  creator:         {label:'Creator-Instructor',     staff:true},
  instructor:      {label:'Instructor',             staff:true},
  student_full:    {label:'Student Full Access',    staff:false},
  student_partial: {label:'Student Partial Access', staff:false}
};
const STUDENT_ROLES = ['student_full','student_partial'];

/* can(user, action, target) — every button in the UI asks this; Firestore rules will mirror it. */
function can(u, action, x){
  if (!u || u.status !== 'active') return false;
  const r = u.role, top = (r === 'owner' || r === 'admin');
  switch (action){
    case 'viewGroup':         return top || r === 'creator' || (r === 'instructor' && x.instructors.includes(u.email));
    case 'createGroup':       return top || r === 'creator';
    case 'deleteGroup':       return top;
    case 'manageMembers':     return top || r === 'creator';                 // invite / change role / remove students
    case 'editFeatures':      return top || r === 'creator';                 // which lessons & tools Partial gets
    case 'assignInstructors': return top || r === 'creator';
    case 'viewRequests':      return top || r === 'creator';
    case 'viewStaff':         return ROLES[r].staff;
    case 'inviteStaffAs':     return r === 'owner' ? ['admin','creator','instructor'].includes(x)
                                   : r === 'admin' ? ['creator','instructor'].includes(x) : false;
    case 'manageStaff':       if (x.role === 'owner') return false;
                              if (r === 'owner') return true;
                              if (r === 'admin') return ['creator','instructor'].includes(x.role);
                              return false;
    case 'transferOwner':     return r === 'owner';
    case 'editContent':       return top || r === 'creator';
    case 'createProblems':    return top || r === 'creator';
    case 'viewRoles':         return ROLES[r].staff;
    case 'viewProgress':      return can(u, 'viewGroup', x);
  }
  return false;
}
/* Can this person open this lesson or tool? */
function canOpen(u, item){
  if (!u || u.status !== 'active') return false;
  if (ROLES[u.role].staff) return item.status === 'published' || can(u, 'editContent');
  if (item.status !== 'published') return false;
  if (u.role === 'student_full') return true;
  const g = groupOf(u);
  return !!g && g.allowed.includes(item.id);
}

/* ===================== Practice problems ===================== */
const TYPE_LABEL = {lesson:'3D lesson', tool:'Tool', problem:'Practice problem'};
const SHAPES = {
  stack:  {label:'1D stack chain', dims:[]},
  prism:  {label:'Plate / block', dims:[['L','Length (X)'],['W','Width (Y)'],['T','Thickness (Z)']]},
  shaft:  {label:'Turned shaft', dims:[]},

/* ---- math (verified-reference §1 and §4) ---- */
function evalStack(chain, f){
  let mean = 0, wc = 0, ss = 0;
  chain.forEach(c => { const U = +c.up || 0, Lo = +c.lo || 0, m = (+c.nom || 0) + (U + Lo)/2, t = (U - Lo)/2;
    mean += (c.dir === '-' ? -1 : 1) * m; wc += Math.abs(t); ss += t*t; });
  const rss = Math.sqrt(ss);
  return {mean, wc, rss, mrss: Math.min((+f || 1.5)*rss, wc)};
}
// C3: method warnings for RSS / MRSS (verified reference §15.3). Y14.5 sets no stack method and no minimum

const RSS_MIN_N_DEFAULT = 4;
function methodNotes(chain, P){

  const N = Math.max(1, Math.round(+((P || {}).rssMinN) || RSS_MIN_N_DEFAULT));

}
function methodHTML(chain, P){
  const m = methodNotes(chain, P);

    <p class="small muted" style="margin:0"><b>RSS assumptions:</b> each contributor is centered on its mean, independent of the others, and roughly normal at about ±3σ. Off-center or flat (uniform) processes make RSS under-predict. Y14.5 doesn't set stack methods or a minimum contributor count; these are practice (verified reference §15.3).</p></div>`;
}
function limits(f){ const s = f.size; return {lo: s[0] - s[2], hi: s[0] + s[1]}; }
function mmcOf(f){ const L = limits(f); return FEAT[f.kind].fos === 'int' ? L.lo : L.hi; }
function lmcOf(f){ const L = limits(f); return FEAT[f.kind].fos === 'int' ? L.hi : L.lo; }
function sizeText(f){ const d = FEAT[f.kind]; if (!f.size) return '—'; const s = f.size;
  return (d.cyl ? 'Ø' : '') + fmt(s[0]) + (s[1] === s[2] ? ` ±${fmt(s[1])}` : ` +${fmt(s[1])}/−${fmt(s[2])}`); }
function evalAccept(P){
  const f = P.features.find(x => x.id === P.ans.feat); if (!f || !f.fcf || !f.fcf.char) return null;

/* ---- rule checker, from the verified-reference control table (§2) ---- */
// Each issue has a code (used by Red-line problems) and a message. Sources: verified reference §2 (control table),
// §3.2 (Ⓜ uses), §4.4 (basic dimensions are toleranced through an FCF, most often position or profile), §7.2 (conc/sym removed).
function fcfIssues(P, f){

    add('basic', 'Its location is given by basic dimensions, but no position or profile frame tolerances them. Basic dimensions carry no tolerance of their own.');
  if (!c.char) return e;

  if (cat === 'removed') add('removed', 'Concentricity and symmetry were removed in Y14.5-2018. Use position, runout or profile.');
  if (cat === 'form' && ds.length) add('formDatum', 'Form tolerances never reference datums.');
  if ((cat === 'orient' || cat === 'runout' || cat === 'location') && !ds.length) add('needDatum', `${ch.label} needs at least one datum reference.`);
  if (c.mod === 'MMC' || c.mod === 'LMC'){
    if (cat === 'profile' || cat === 'runout' || c.char === 'circularity' || c.char === 'cylindricity' || cat === 'removed') add('mod', `${ch.label} can't take Ⓜ or Ⓛ on its tolerance.`);

  if (!(+c.tol > 0) && !(+c.tol === 0 && (c.mod === 'MMC' || c.mod === 'LMC'))) add('other', 'Tolerance must be greater than zero (zero is only valid at MMC or LMC).');

/* ---- FCF drawing ---- */
function symSVG(ch, cx, cy, s, col){
  const L = (x1,y1,x2,y2) => `<line x1="${cx+x1*s}" y1="${cy+y1*s}" x2="${cx+x2*s}" y2="${cy+y2*s}" stroke="${col}" stroke-width="1.3"/>`;
  const C = r => `<circle cx="${cx}" cy="${cy}" r="${r*s}" fill="none" stroke="${col}" stroke-width="1.3"/>`;
  switch (ch){
    case 'position': return C(.24) + L(-.4,0,.4,0) + L(0,-.4,0,.4);
    case 'flatness': return `<polygon points="${cx-.36*s},${cy+.14*s} ${cx-.16*s},${cy-.14*s} ${cx+.36*s},${cy-.14*s} ${cx+.16*s},${cy+.14*s}" fill="none" stroke="${col}" stroke-width="1.3"/>`;
    case 'straightness': return L(-.36,0,.36,0);
    case 'circularity': return C(.28);
    case 'cylindricity': return C(.22) + L(-.3,.32,-.08,-.32) + L(.08,.32,.3,-.32);
    case 'profileSurface': return `<path d="M${cx-.3*s},${cy+.14*s} A${.3*s},${.3*s} 0 0 1 ${cx+.3*s},${cy+.14*s} Z" fill="none" stroke="${col}" stroke-width="1.3"/>`;
    case 'profileLine': return `<path d="M${cx-.3*s},${cy+.14*s} A${.3*s},${.3*s} 0 0 1 ${cx+.3*s},${cy+.14*s}" fill="none" stroke="${col}" stroke-width="1.3"/>`;
    case 'parallelism': return L(-.28,.3,-.04,-.3) + L(.04,.3,.28,-.3);
    case 'perpendicularity': return L(0,-.32,0,.3) + L(-.32,.3,.32,.3);
    case 'angularity': return L(-.3,.3,.32,.3) + L(-.3,.3,.24,-.28);
    case 'circRunout': return L(-.2,.3,.2,-.3) + `<polygon points="${cx+.2*s},${cy-.3*s} ${cx+.02*s},${cy-.22*s} ${cx+.16*s},${cy-.1*s}" fill="${col}"/>`;
    case 'totalRunout': return L(-.3,.3,-.06,-.28) + L(.06,.3,.3,-.28) + L(-.3,.3,.06,.3) + `<polygon points="${cx-.06*s},${cy-.28*s} ${cx-.2*s},${cy-.18*s} ${cx-.08*s},${cy-.1*s}" fill="${col}"/><polygon points="${cx+.3*s},${cy-.28*s} ${cx+.16*s},${cy-.18*s} ${cx+.28*s},${cy-.1*s}" fill="${col}"/>`;
    case 'concentricity': return C(.14) + C(.3);
    case 'symmetry': return L(-.34,0,.34,0) + L(-.2,-.2,.2,-.2) + L(-.2,.2,.2,.2);
  }

}
function fcfSVG(c, col){
  if (!c || !c.char) return '<span class="small muted">No callout</span>';
  const h = 26, fs = 15, ds = (c.datums || []).filter(Boolean);
  const tolTxt = (c.dia ? 'Ø' : '') + fmt(+c.tol || 0);
  const modW = (c.mod === 'MMC' || c.mod === 'LMC') ? 20 : 0;
  const w0 = 28, w1 = tolTxt.length*9.2 + 14 + modW, wd = 24;
  const W = w0 + w1 + ds.length*wd + 2;
  let s = `<svg class="fcfsvg" viewBox="0 0 ${W} ${h+2}" width="${W}" height="${h+2}" role="img" aria-label="${esc(CHARS[c.char].label)} ${esc(tolTxt)} ${c.mod!=='RFS'?c.mod:''} ${ds.join(' ')}">`;
  let x = 1;
  const box = w => { s += `<rect x="${x}" y="1" width="${w}" height="${h}" fill="none" stroke="${col}" stroke-width="1.2"/>`; };
  box(w0); s += symSVG(c.char, x + w0/2, 1 + h/2, h*.78, col); x += w0;
  box(w1); s += `<text x="${x+7}" y="${1+h/2+5}" font-family="IBM Plex Mono, monospace" font-size="${fs}" fill="${col}">${esc(tolTxt)}</text>`;
  if (modW){ const mx = x + w1 - 13; s += `<circle cx="${mx}" cy="${1+h/2}" r="7.5" fill="none" stroke="${col}" stroke-width="1.1"/><text x="${mx}" y="${1+h/2+4}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10.5" font-weight="600" fill="${col}">${c.mod==='MMC'?'M':'L'}</text>`; }
  x += w1;
  ds.forEach(L => { box(wd); s += `<text x="${x+wd/2}" y="${1+h/2+5}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="${fs}" fill="${col}">${esc(L)}</text>`; x += wd; });

function studentLoopP(P, a){
  const rows = (a.rows || []).filter(r => r.from && r.to && r.from !== r.to);
  const chain = rows.map((r, i) => { const m = rowModel(P, {faceFrom: r.from, faceTo: r.to}); return {name: 'Your row ' + (i+1), nom: m ? +m.dist.toFixed(5) : 0, up: 0, lo: 0, dir: r.dir === '-' ? '-' : '+', faceFrom: r.from, faceTo: r.to}; });
  return Object.assign({}, P, {dims: Object.assign({}, P.dims, {chain})});
}
function gradeLoop(P, a){
  const key = P.dims.chain, rows = (a.rows || []).filter(r => r.from && r.to && r.from !== r.to), used = new Set();
  const same = (r, k) => (r.from === k.faceFrom && r.to === k.faceTo) || (r.from === k.faceTo && r.to === k.faceFrom);
  const fn = id => { const f = faceById(P, id); return f ? esc(f.name) : '—'; };
  let found = 0, signs = 0;
  const lines = key.map((k, i) => { const j = rows.findIndex((r, x) => !used.has(x) && same(r, k));
    if (j < 0) return `✗ Missed: ${fn(k.faceFrom)} → ${fn(k.faceTo)} (${k.dir === '-' ? '−' : '+'})`;
    used.add(j); found++; const sOK = (rows[j].dir === '-' ? '-' : '+') === (k.dir === '-' ? '-' : '+'); if (sOK) signs++;
    return `✓ Found: ${fn(k.faceFrom)} → ${fn(k.faceTo)} · sign ${sOK ? '✓' : `✗ should be ${k.dir === '-' ? '−' : '+'} (${signCheck(k.dir)})`}`; });
  const extra = rows.filter((r, x) => !used.has(x));
  extra.forEach(r => lines.push(`✗ Not part of this loop: ${fn(r.from)} → ${fn(r.to)}`));
  const score = key.length ? Math.round(50 * found / (key.length + extra.length) + 50 * signs / key.length) : 0;
  const S = studentLoopP(P, a), cl = loopClosure(S);
  lines.push(`<span class="small muted">Your loop: Σ(signed nominals) = ${fmt(cl.sum)}${cl.ok == null ? '' : ` · gap on the model = ${fmt(cl.gap)} · ${cl.ok ? 'closes ✓' : 'does not close ✗'}`}. Score = 50% contributors found (extras count against) + 50% signs right.</span>`);
  return {score, html: lines.join('<br>')};
}
function loopBuilder(P){
  const a = UI.play.ans, faces = stackFaces(P), fo = [['', 'Pick a face…']].concat(faces.map(f => [f.id, f.name]));
  const sel = (i, k, v) => `<select id="lr-${k}-${i}" data-lr="${i}.${k}" style="max-width:200px">${fo.map(([id, t]) => `<option value="${esc(id)}" ${id === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  const n = P.dims.chain.length;
  return `<div class="msg info">Gap: <b>${esc((faceById(P, P.gap.faceFrom) || {}).name || '—')}</b> → <b>${esc((faceById(P, P.gap.faceTo) || {}).name || '—')}</b>. Build the chain of dimensions that controls it.${P.loopShowCount ? ` There are <b>${n}</b> contributors.` : ''}</div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>#</th><th>From face</th><th>To face</th><th>Sign</th><th class="r">Length on model</th><th></th></tr></thead><tbody>${
      (a.rows || []).map((r, i) => { const m = r.from && r.to ? rowModel(P, {faceFrom: r.from, faceTo: r.to}) : null;
        return `<tr data-lrow="${i}"><td class="mono small"><span class="sw" style="background:${rowColor(i)}"></span>${i+1}</td><td>${sel(i, 'from', r.from)}</td><td>${sel(i, 'to', r.to)}</td>
          <td><select id="lr-dir-${i}" data-lr="${i}.dir"><option value="+" ${r.dir !== '-' ? 'selected' : ''}>+ opens the gap</option><option value="-" ${r.dir === '-' ? 'selected' : ''}>− closes the gap</option></select></td>
          <td class="r mono small">${m ? fmt(m.dist) : ''}</td><td class="r"><button class="btn sm danger" type="button" data-act="lrDel" data-i="${i}" aria-label="Remove row ${i+1}">×</button></td></tr>`; }).join('')}</tbody></table></div>
    <div class="row"><button class="btn sm" type="button" data-act="lrAdd">Add contributor</button><span class="small muted">${SIGN_Q} Your vectors draw on the model as you pick faces.</span></div>`;
}

function answerSetup(P){
  if (P.ptype === 'loop'){
    const fn = id => { const f = faceById(P, id); return f ? esc(f.name) : '—'; };
    return `<div class="math">Answer key (hidden from students): ${P.dims.chain.length} contributors<br>${P.dims.chain.map((c, i) => `${i+1}. ${fn(c.faceFrom)} → ${fn(c.faceTo)} · ${c.dir === '-' ? '−' : '+'} · ${fmt(+c.nom)}`).join('<br>')}<br>Graded: 50% contributors found (a face pair matches in either order; extra rows count against) + 50% signs right. Make sure each dimension has only one sensible face pair.</div>`;
  }
  if (P.ptype === 'stack'){
    P.ans = P.ans || {}; if (!P.ans.ask) P.ans.ask = 'wcMin'; if (P.ans.tol == null) P.ans.tol = .0005; if (P.rssMinN == null) P.rssMinN = RSS_MIN_N_DEFAULT;
    const r = evalStack(P.dims.chain, P.mrssF), key = ASK[P.ans.ask][1](r);
    return `<div class="row">${inSel('problem.ans.ask', P.ans.ask, Object.entries(ASK).map(([k,v]) => [k, v[0]]), 'Ask for')}${inNum('problem.ans.tol', P.ans.tol, 'Grade within ±', 80)}${isModelStack(P) ? '' : inNum('problem.rssMinN', P.rssMinN, 'RSS warning below N contributors (company practice)', 60)}</div>
      <div class="math">Mean gap = Σ(± mean dims) = ${fmt(r.mean)}<br>WC = Σ|t| = ±${fmt(r.wc)} · RSS = √Σt² = ±${fmt(r.rss)} · MRSS = min(${+P.mrssF || 1.5}·RSS, WC) = ±${fmt(r.mrss)}<br><b>Answer key: ${ASK[P.ans.ask][0]} = ${fmt(key)}</b></div>${isModelStack(P) ? '' : methodHTML(P.dims.chain, P)}`;
  }
  if (P.ptype === 'accept'){
    P.ans = P.ans || {}; P.ans.meas = P.ans.meas || {size:0, dx:0, dy:0, dev:0};
    const cands = P.features.filter(f => f.fcf && f.fcf.char && f.fcf.char !== 'concentricity' && f.fcf.char !== 'symmetry');
    if (!cands.find(f => f.id === P.ans.feat)) P.ans.feat = cands.length ? cands[0].id : '';
    if (!cands.length) return `<div class="empty">Give at least one feature a callout in step 5 first.</div>`;
    const f = cands.find(f => f.id === P.ans.feat), c = f.fcf, d = FEAT[f.kind], m = P.ans.meas;
    let h = `<div class="row">${inSel('problem.ans.feat', P.ans.feat, cands.map(f => [f.id, `${f.id} · ${FEAT[f.kind].label} · ${CHARS[f.fcf.char].label}`]), 'Feature inspected')}</div><div class="row">`;
    if (d.fos && f.size) h += inNum('problem.ans.meas.size', m.size, 'Measured size (mating envelope)', 110);
    if (c.char === 'position'){ h += inNum('problem.ans.meas.dx', m.dx, d.cyl ? 'X offset from true position' : 'Offset of center plane', 110); if (d.cyl) h += inNum('problem.ans.meas.dy', m.dy, 'Y offset', 90); }
    else h += inNum('problem.ans.meas.dev', m.dev, `Measured ${CHARS[c.char].label.toLowerCase()}`, 110);
    h += `</div>`;
    const r = evalAccept(P);
    if (r) h += `<div class="math">${d.fos && f.size ? `Size ${fmt(+m.size)} within ${fmt(limits(f).lo)}–${fmt(limits(f).hi)}: ${r.sizeOK ? 'yes' : 'NO'}<br>` : ''}${c.mod !== 'RFS' && d.fos ? `Bonus = |size − ${c.mod}| = ${fmt(r.bonus)}<br>` : ''}Allowed = ${fmt(+c.tol)}${c.mod !== 'RFS' && d.fos && r.sizeOK ? ' + ' + fmt(r.bonus) : ''} = ${fmt(r.allowed)}<br>Measured = ${c.char === 'position' ? (d.cyl ? `2√(${fmt(+m.dx)}² + ${fmt(+m.dy)}²)` : `2 × |${fmt(+m.dx)}|`) + ' = ' : ''}${fmt(r.measured)}<br><b>Answer key: ${r.pass ? 'ACCEPT' : 'REJECT'}, measured ${fmt(r.measured)}</b></div>`;

  if (P.ptype === 'errors'){
    const withC = P.features.filter(f => f.fcf && f.fcf.char), errs = errorSet(P);
    return `<div class="math">${withC.length} callouts shown to students. ${errs.length} count as wrong: ${errs.join(', ') || 'none yet'}.<br>Students check each frame they think is wrong; they're graded on every frame, right or wrong.</div>`;
  }
  if (P.ptype === 'redline'){
    const lines = P.features.map(f => { const ex = rlExpected(P, f); return `<b class="mono">${f.id}</b> ${ex.length ? ex.map(k => RL_MARKS.find(m => m[0] === k)[1]).join(' + ') : 'no mark (correct as drawn)'}`; });

function grade(P, a){
  if (P.ptype === 'loop') return gradeLoop(P, a);
  if (P.ptype === 'stack'){
    const key = ASK[P.ans.ask][1](evalStack(P.dims.chain, P.mrssF)), v = parseFloat(a.val), ok = Math.abs(v - key) <= (+P.ans.tol || .0005) + 1e-9;
    const r = evalStack(P.dims.chain, P.mrssF);
    return {score: ok ? 100 : 0, html: `${ok ? 'Correct.' : 'Not quite.'} ${ASK[P.ans.ask][0]} = ${fmt(key)}.<br><span class="mono small">Mean ${fmt(r.mean)} · WC ±${fmt(r.wc)} · RSS ±${fmt(r.rss)}. Convert unequal tolerances to mean ± equal first: mean = nominal + (upper + lower)/2.</span>${/rss/i.test(P.ans.ask) ? methodHTML(P.dims.chain, P) : ''}`};
  }
  if (P.ptype === 'accept'){
    const r = evalAccept(P), v = parseFloat(a.val);
    const okV = a.verdict === (r.pass ? 'accept' : 'reject'), okN = Math.abs(v - r.measured) <= .0002;
    const why = !r.sizeOK ? 'Size is outside its limits, so the part is rejected regardless of location.' : `Allowed ${fmt(r.allowed)}${r.bonus > 0 ? ` (includes ${fmt(r.bonus)} bonus)` : ''}; measured ${fmt(r.measured)}.`;
    return {score: (okV ? 50 : 0) + (okN ? 50 : 0), html: `Decision ${okV ? 'correct' : 'should be ' + (r.pass ? 'ACCEPT' : 'REJECT')}. Measured value ${okN ? 'correct' : 'should be ' + fmt(r.measured)}.<br>${why}`};
  }
  if (P.ptype === 'errors'){
    const fs = P.features.filter(f => f.fcf && f.fcf.char), wrong = new Set(errorSet(P)); let right = 0;
    const lines = fs.map(f => { const said = !!(a.e && a.e[f.id]), is = wrong.has(f.id); if (said === is) right++;
      const why = is ? checkFCF(P,f).concat(f.fcf.planted && f.fcf.note ? [f.fcf.note] : []).join(' ') : 'This frame is valid.';
      return `<b class="mono">${f.id}</b> ${said === is ? '✓' : '✗'} ${esc(why)}${f.fcf.why ? ` <span class="whyi">${esc(f.fcf.why)}</span>` : ''}`; });
    return {score: Math.round(right / Math.max(1, fs.length) * 100), html: lines.join('<br>')};
  }
  if (P.ptype === 'redline'){
    const rl = a.rl || {}; let right = 0;
    const name = k => RL_MARKS.find(m => m[0] === k)[1];
    const lines = P.features.map(f => { const ex = rlExpected(P, f).sort(), got = (rl[f.id] || []).slice().sort(), ok = ex.join() === got.join(); if (ok) right++;
      const why = fcfIssues(P, f).map(x => x.msg).concat(f.fcf && f.fcf.planted && f.fcf.note ? [f.fcf.note] : []);
      return `<b class="mono">${f.id}</b> ${ok ? '✓' : '✗'} ${ex.length ? 'Should be marked: ' + ex.map(name).join(' + ') + '. ' + esc(why.join(' ')) : 'Correct as drawn: no mark.'}${!ok && got.length ? ` <span class="muted">You marked: ${got.map(name).join(' + ')}.</span>` : ''}${f.fcf && f.fcf.why ? ` <span class="whyi">${esc(f.fcf.why)}</span>` : ''}`; });
    return {score: Math.round(right / Math.max(1, P.features.length) * 100), html: lines.join('<br>') + '<br><span class="small muted">Each feature scores only when its marks match exactly.</span>'};
  }
  if (P.ptype === 'pick'){
    const ci = +P.ans.correct, pi = a.pick === '' || a.pick == null ? -1 : +a.pick, ok = pi === ci, C = P.choices[ci], Pk = P.choices[pi];
    return {score: ok ? 100 : 0, html: `${ok ? 'Correct.' : 'Not this one.'}${!ok && Pk ? `<br><b>You picked</b> ${fcfSVG(Pk.fcf, inkColor())} ${esc(Pk.why || '')}` : ''}<br><b>Best for the function:</b> ${fcfSVG(C.fcf, inkColor())} ${esc(C.why || '')}`};
  }
  if (P.ptype === 'fcf'){
    const k = P.features.find(x => x.id === P.ans.feat).fcf; const checks = [
      ['Characteristic', a.char === k.char, CHARS[k.char].label], ['Ø symbol', !!a.dia === !!k.dia, k.dia ? 'Ø' : 'no Ø'],
      ['Tolerance', Math.abs(parseFloat(a.tol) - k.tol) < 1e-6, fmt(k.tol)], ['Modifier', (a.mod || 'RFS') === k.mod, k.mod],
      ['Primary datum', (a.d0 || '') === (k.datums[0] || ''), k.datums[0] || 'none'], ['Secondary datum', (a.d1 || '') === (k.datums[1] || ''), k.datums[1] || 'none'],
      ['Tertiary datum', (a.d2 || '') === (k.datums[2] || ''), k.datums[2] || 'none']];
    const n = checks.filter(c => c[1]).length;
    return {score: Math.round(n / checks.length * 100), html: checks.map(c => `${c[1] ? '✓' : '✗'} ${c[0]}${c[1] ? '' : ': should be ' + esc(c[2])}`).join('<br>') + `<br>Answer: ${fcfSVG(k, inkColor())}`};
  }
  return {score:0, html:''};
}

const isPin = p => /^\d{6}$/.test(p);
let VIA_LINK = false;   // true when this sign-in came from an email link
let LINK_PENDING = false;   // page opened from an email link that hasn't been used yet: ignore any older saved sign-in
const EMAIL_KEY = 'gdtEmailForSignIn';
const COLS = {people:'email', groups:'id', catalog:'id', requests:'id'};
let DB = null, SNAP = null, AUTH = {state:'loading', user:null};
const clean = o => JSON.parse(JSON.stringify(o));                      // drops undefined (Firestore rejects it)
const stripKey = (o, k) => { const c = clean(o); delete c[k]; return c; };
function snapshotOf(d){
  const s = {progress: clean(d.progress || {})};
  Object.entries(COLS).forEach(([c,k]) => { s[c] = {}; (d[c] || []).forEach(x => s[c][x[k]] = stripKey(x, k)); });
  return s;
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function save(){
  if (!DB || !SNAP || AUTH.state !== 'active') return;
  const now = snapshotOf(DB), batch = writeBatch(fdb);
  let n = 0;
  Object.keys(COLS).concat(['progress']).forEach(c => {
    const a = SNAP[c], b = now[c];
    Object.keys(b).forEach(id => { if (!a[id] || !same(a[id], b[id])) { batch.set(doc(fdb, c, id), b[id]); n++; } });
    Object.keys(a).forEach(id => { if (!b[id]) { batch.delete(doc(fdb, c, id)); n++; } });
  });
  if (!n) return;
  const prev = SNAP; SNAP = now;
  batch.commit().catch(err => {
    console.error('[gdt] save refused', err);
    SNAP = prev;
    toast(err.code === 'permission-denied' ? 'Not saved: you don’t have permission for that change.' : 'Not saved: ' + (err.message || err));
    loadAll().then(render);
  });
}
async function getAll(q){ const s = await getDocs(q); return s.docs.map(d => ({id:d.id, data:d.data()})); }
async function loadAll(){
  const email = AUTH.user.email.toLowerCase();
  const meSnap = await getDoc(doc(fdb, 'people', email));
  const meRec = Object.assign({email}, meSnap.data());
  const r = meRec.role, manager = ['owner','admin','creator'].includes(r), staff = manager || r === 'instructor';
  const d = {who: email, catalog: [], groups: [], people: [], requests: [], progress: {}};
  d.catalog = (await getAll(collection(fdb, 'catalog'))).map(x => Object.assign({id:x.id}, x.data))
    .sort((a,b) => (a.order ?? 999) - (b.order ?? 999) || a.id.localeCompare(b.id));
  const people = {}; people[email] = meRec;
  const addPeople = list => list.forEach(x => people[x.id] = Object.assign({email:x.id}, x.data));
  if (manager){
    addPeople(await getAll(collection(fdb, 'people')));
    d.groups = (await getAll(collection(fdb, 'groups'))).map(x => Object.assign({id:x.id}, x.data));
    d.requests = (await getAll(collection(fdb, 'requests'))).map(x => Object.assign({id:x.id}, x.data))
      .sort((a,b) => String(b.date).localeCompare(String(a.date)));
    (await getAll(collection(fdb, 'progress'))).forEach(x => d.progress[x.id] = x.data);
  } else if (r === 'instructor'){
    addPeople(await getAll(query(collection(fdb, 'people'), where('group', '==', null))));
    d.groups = (await getAll(query(collection(fdb, 'groups'), where('instructors', 'array-contains', email)))).map(x => Object.assign({id:x.id}, x.data));
    for (const g of d.groups) addPeople(await getAll(query(collection(fdb, 'people'), where('group', '==', g.id))));
  } else if (meRec.group){
    const g = await getDoc(doc(fdb, 'groups', meRec.group));
    if (g.exists()) d.groups = [Object.assign({id:g.id}, g.data())];
  }
  d.people = Object.values(people);
  if (!manager){
    const emails = staff ? d.people.filter(p => p.group).map(p => p.email).concat(email) : [email];
    for (const e of emails){ const p = await getDoc(doc(fdb, 'progress', e)); if (p.exists()) d.progress[e] = p.data(); }
  }
  DB = d; SNAP = snapshotOf(d);
}
// First sign-in by the site's bootstrap email, while the site has no config yet: become Owner.
async function tryBootstrap(email){
  if (email !== BOOTSTRAP_EMAIL) return false;
  try {
    const b = writeBatch(fdb);
    b.set(doc(fdb, 'site', 'config'), {ownerEmail: email});
    b.set(doc(fdb, 'people', email), {name:'Site Owner', role:'owner', status:'active', group:null, invitedBy:'bootstrap', invitedAt: today()});
    await b.commit();
    return true;
  } catch(e){ console.error('[gdt] bootstrap refused', e); return false; }
}
async function afterSignIn(user){
  AUTH = {state:'loading', user}; render();
  const email = user.email.toLowerCase();
  try {
    let s = await getDoc(doc(fdb, 'people', email));
    if (!s.exists() && await tryBootstrap(email)) s = await getDoc(doc(fdb, 'people', email));
    if (!s.exists()){
      UI.landingMsg = {kind:'err', text:`<b>${esc(email)}</b> hasn't been invited yet. Ask your company's training contact to add you${REQUESTS_OPEN ? ', or request access for your company below' : ''}.`};
      AUTH = {state:'out', user:null}; await signOut(auth); return render();
    }
    if (s.data().status === 'invited'){ AUTH = {state:'invited', user}; UI.signupEmail = email; UI.signupStep = 'name'; return render(); }
    if (!s.data().pinSet || VIA_LINK){ AUTH = {state:'invited', user}; UI.signupEmail = email; UI.signupStep = 'pin'; UI.pinReset = !!s.data().pinSet; return render(); }
    await loadAll();
    AUTH = {state:'active', user}; UI.signupStep = null; UI.tab = UI.tab || 'learn';
    render();
  } catch(e){
    console.error('[gdt] sign-in load failed', e);
    UI.landingMsg = {kind:'err', text:'Signed in, but the site data could not be loaded (' + esc(e.code || e.message) + '). Try again, or contact the site owner.'};
    AUTH = {state:'out', user:null}; await signOut(auth); render();
  }
}
function sendLink(){
  const e = norm(($('siEmail') || {}).value); UI.signupEmail = e;
  if (!isEmail(e)){ UI.landingMsg = {kind:'err', text:'Enter your email above first, then click <b>Email me a sign-in link</b>.'}; return render(); }
  UI.landingMsg = {kind:'info', text:'Sending…'}; render();
  sendSignInLinkToEmail(auth, e, {url: location.origin + location.pathname, handleCodeInApp: true})
    .then(() => { try { localStorage.setItem(EMAIL_KEY, e); } catch(x){} UI.landingMsg = {kind:'ok', text:`Check <b>${esc(e)}</b> for a sign-in link from Firebase. Open it in this browser if you can. If you open it somewhere else, the site will ask for your email. The link only works if your email is on the invitation list. Look in spam if it doesn't arrive in a few minutes.`}; render(); })
    .catch(err => { UI.landingMsg = {kind:'err', text:'Could not send the link: ' + esc(err.code || err.message)}; render(); });
}
// Use the email link from the address bar. Any older saved sign-in in this browser is replaced.
function finishLink(email){
  AUTH = {state:'loading', user:null}; UI.signupStep = null; render();

    .then(cred => {

      try { await signOut(auth); } catch(x){}
      UI.landingMsg = {kind:'err', text:'That link didn\u2019t work (' + esc(err.code || err.message) + '). Links can be used once and expire after a while. Request a new one below and use the newest email.'};

// Set the PIN as the account password, then record it on the person's record.
async function savePin(pin, fields, msg){
  const email = AUTH.user.email.toLowerCase();
  try {
    await updatePassword(auth.currentUser, pin);
    await setDoc(doc(fdb, 'people', email), fields, {merge: true});
    VIA_LINK = false; UI.landingMsg = null; UI.pinReset = false;
    toast(msg || 'PIN saved. Use it with your email next time.');
    return afterSignIn(auth.currentUser);
  } catch(err){
    console.error('[gdt] save PIN failed', err);
    if (err.code === 'auth/requires-recent-login'){
      // This browser's sign-in is too old to set a PIN. Send a fresh link and sign out.
      try { await sendSignInLinkToEmail(auth, email, {url: location.origin + location.pathname, handleCodeInApp: true}); localStorage.setItem(EMAIL_KEY, email); } catch(x){}
      await signOut(auth);
      UI.signupEmail = email;
      UI.landingMsg = {kind:'info', text:`Your sign-in in this browser was too old to set a PIN, so we signed you out and emailed a fresh link to <b>${esc(email)}</b>. Open the newest email's link to choose your PIN.`};
      return render();
    }
    UI.landingMsg = {kind:'err', text:'Could not save the PIN (' + esc(err.code || err.message) + ').'};
    render();
  }
}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastT;
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200); }
function today(){ return new Date().toISOString().slice(0,10); }
// A5 review queue (light spaced repetition, stored in progress[itemId].rv = {box, due, miss}).
// A miss (problem score under 100, or a lesson quiz under 5/5) puts the item in the queue, due tomorrow.
// A perfect re-try once it's due moves it up a box: due again in 3 days, then 7; a third one clears it.
// Re-trying early is fine for practice but doesn't move the item.
const RV_DAYS = [1, 3, 7];
function addDays(d, n){ const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0,10); }
function reviewUpdate(rec, perfect){
  const rv = rec.rv;
  if (!perfect){ rec.rv = {box:0, due: addDays(today(), RV_DAYS[0]), miss: ((rv && rv.miss) || 0) + 1}; return rec; }
  if (!rv || rv.due > today()) return rec;   // a perfect re-try only counts once the item is due
  const box = rv.box + 1;
  if (box >= RV_DAYS.length) delete rec.rv; else rec.rv = {box, due: addDays(today(), RV_DAYS[box]), miss: rv.miss};
  return rec;
}
function reviewList(u){
  const pr = progressFor(u.email), t = today();
  return DB.catalog.filter(it => pr[it.id] && pr[it.id].rv && canOpen(u, it)).map(it => ({it, rv: pr[it.id].rv, due: pr[it.id].rv.due <= t})).sort((a,b) => a.rv.due.localeCompare(b.rv.due));
}
function reviewPanel(u){
  const L = reviewList(u); if (!L.length) return '';
  const dueN = L.filter(x => x.due).length;
  return `<div class="panel pad rvq"><div class="row" style="justify-content:space-between"><h3>Review queue</h3><span class="small muted">${dueN} due now · ${L.length - dueN} coming up</span></div>
    ${L.map(({it, rv, due}) => `<div class="rvi"><span class="k mono small">${it.id.toUpperCase()}</span><b style="font-weight:500">${esc(it.title)}</b><span class="st ${due ? 'due' : 'active'}">${due ? 'Due now' : 'Due ' + rv.due}</span><span class="small muted">missed ${rv.miss}× · step ${rv.box + 1} of ${RV_DAYS.length}</span><span style="flex:1"></span><button class="btn sm ${due ? 'primary' : ''}" type="button" data-act="${it.type === 'problem' ? 'play' : 'open'}" data-id="${it.id}">${it.type === 'problem' ? 'Try it' : 'Open lesson'}</button></div>`).join('')}
    <span class="small muted">Missed items come back tomorrow, then after 3 and 7 days of perfect re-tries. ${L.some(x => x.it.type === 'lesson') ? 'For lessons, re-take the quiz and save a 5/5 score.' : ''}</span></div>`;
}

    if (isLesson && p.opened) foot += `<label class="small muted">Quiz score <select data-act="quiz" data-id="${it.id}"><option value="">–</option>${[0,1,2,3,4,5].map(n=>`<option ${p.quiz===n?'selected':''}>${n}</option>`).join('')}</select> / 5</label>`;
    foot += `</div>`;
  }
  const status = it.status === 'draft' ? ` <span class="st draft">Draft · staff only</span>` : '';
  const rvDue = p.rv && p.rv.due <= today();
  const done = (rvDue ? `<span class="st due">Review due</span> ` : '') + (p.opened ? `<span class="st active">${isProb ? (p.score!=null ? `Best ${p.score}%` : 'Started') : isLesson ? (p.quiz!=null ? `Quiz ${p.quiz}/5` : 'Opened') : 'Used'}</span>` : '');
  return `<div class="panel item${ok?'':' locked'}"><div class="row" style="justify-content:space-between"><span class="k">${it.id.toUpperCase()} · ${TYPE_LABEL[it.type]}</span>${done}</div><h3>${esc(it.title)}${status}</h3><p>${esc(it.desc)}</p>${foot}</div>`;
}

      }).join('')}</tr>`;
    });
    h += `</tbody></table></div></div>`;

  return h + `</div>`;

function render(){
  renderWho();
  const u = me();
  $('main').innerHTML = (u && u.status === 'active') ? renderApp(u) : renderLanding();
  if (!u) return;
  if (u && u.status === 'active' && document.getElementById('viewerSlot')){
    let P = UI.tab === 'creator' && UI.pc.draft ? UI.pc.draft.problem : UI.tab === 'play' ? playP(UI.play.preview ? UI.pc.draft : item(UI.play.id)) : null;
    if (P && UI.tab === 'play' && P.ptype === 'loop' && UI.play.result == null && !UI.teach.on) P = studentLoopP(P, UI.play.ans);
    if (P && UI.tab === 'play' && P.shape === 'stack' && UI.play.ans.orient) P = Object.assign({}, P, {dims: Object.assign({}, P.dims, {orient: UI.play.ans.orient})});
    if (P) mountViewer(P, {ctx: UI.tab === 'creator' ? 'c' + (UI.pc.draft.id||'new') : 'p' + (UI.play.preview ? 'prev' : UI.play.id), reframe: UI.reframe, loop: loopOptsFor(u)}); UI.reframe = false;

}

/* ===================== Actions ===================== */
function act(fn, msg){ fn(); save(); render(); if (msg) toast(msg); }
function emailTaken(e){ return !!person(e); }

document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  const u = me();
  if (f.id === 'fSignin'){
    const e = norm($('siEmail').value), pin = $('siPin').value.trim(); UI.signupEmail = e;
    if (!isEmail(e)){ UI.landingMsg = {kind:'err', text:'Enter a full email address, like name@company.com.'}; return render(); }
    if (!isPin(pin)){ UI.landingMsg = {kind:'err', text:'Enter your 6-digit PIN. First time here? Use <b>Email me a sign-in link</b>.'}; return render(); }
    UI.landingMsg = null; AUTH.state = 'loading'; render();
    signInWithEmailAndPassword(auth, e, pin).catch(err => {
      AUTH = {state:'out', user:null};
      UI.landingMsg = {kind:'err', text: err.code === 'auth/too-many-requests'
        ? 'Too many tries. Wait a few minutes, or use <b>Email me a sign-in link</b> and choose a new PIN.'
        : 'That email and PIN don\u2019t match. Forgot your PIN, or haven\u2019t set one yet? Use <b>Email me a sign-in link</b>.'};
      render();
    });
    return;
  }
  if (f.id === 'fPin'){
    const p1 = $('pin1').value.trim(), p2 = $('pin2').value.trim();
    if (!isPin(p1)){ UI.landingMsg = {kind:'err', text:'The PIN must be exactly 6 digits.'}; return render(); }
    if (p1 !== p2){ UI.landingMsg = {kind:'err', text:'The two PINs don\u2019t match.'}; return render(); }
    return savePin(p1, {pinSet: true});
  }
  if (f.id === 'fConfirm'){
    const e = norm($('cfEmail').value); if (!isEmail(e)) return;
    finishLink(e);
    return;
  }
  if (f.id === 'fName'){
    const n = $('suName').value.trim(); UI.suName = n;
    if (!n){ UI.landingMsg = {kind:'err', text:'Add your name.'}; return render(); }
    const p1 = $('pin1').value.trim(), p2 = $('pin2').value.trim();
    if (!isPin(p1)){ UI.landingMsg = {kind:'err', text:'The PIN must be exactly 6 digits.'}; return render(); }
    if (p1 !== p2){ UI.landingMsg = {kind:'err', text:'The two PINs don\u2019t match.'}; return render(); }
    return savePin(p1, {name: n, status: 'active', pinSet: true}, `Welcome, ${n}.`);
  }
  if (f.id === 'fReq'){
    const co = $('rqCo').value.trim(), nm = $('rqName').value.trim(), e = norm($('rqEmail').value);
    if (!co || !nm || !isEmail(e)){ UI.reqMsg = {kind:'err', text:'Fill in company, your name and a full work email.'}; return render(); }
    addDoc(collection(fdb, 'requests'), {company:co, contact:nm, email:e, size:$('rqSize').value, note:$('rqNote').value.trim().slice(0,2000), date:today(), done:false})
